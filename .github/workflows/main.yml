name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Fixes the ERESOLVE typescript/typescript-eslint conflict.
  # Env-based npm config also reaches the nested frontend install.
  npm_config_legacy_peer_deps: "true"
  # Repo's .npmrc sets package-lock=false; override so lockfiles are
  # generated — Sonatype will scan these in stage 2.
  npm_config_package_lock: "true"

jobs:
  build:
    runs-on: self-hosted   # your Mac (MBP-FHYXMQJ76D)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Juice Shop's postinstall hook does the full compile:
      # installs frontend deps, builds the Angular frontend, runs tsc for the server
      - name: Install dependencies & compile
        run: npm install

      - name: Compile result
        run: echo "Build completed OK on $(hostname)"
