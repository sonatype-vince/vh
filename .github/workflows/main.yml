name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Pull ALL npm packages through your Nexus Repository proxy
  npm_config_registry: http://localhost:8081/repository/demo-npm-proxy/
  npm_config_legacy_peer_deps: "true"
  # Repo's .npmrc sets package-lock=false; override so lockfiles are
  # generated for the Sonatype scan below
  npm_config_package_lock: "true"

jobs:
  build:
    runs-on: self-hosted   # your Mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Undo Dependabot's major-version bumps so the app compiles
      # (permanent fix: commit these files and disable Dependabot)
      - name: Restore upstream v20.1.1 dependency manifests
        run: |
          curl -fsSL -o package.json https://raw.githubusercontent.com/juice-shop/juice-shop/v20.1.1/package.json
          curl -fsSL -o frontend/package.json https://raw.githubusercontent.com/juice-shop/juice-shop/v20.1.1/frontend/package.json

      # Pin vitest to exact known-good versions. The manifest says "^4.1.1"
      # (= newest 4.x), so every new vitest release changes what we install —
      # and brand-new versions may not be available through the proxy yet.
      # Exact pins make the build reproducible.
      - name: Pin vitest to exact versions
        run: |
          cd frontend
          npm pkg set 'devDependencies.vitest=4.1.1'
          npm pkg set 'devDependencies.@vitest/coverage-v8=4.1.2'

      - name: Confirm npm is pointed at Nexus
        run: npm config get registry

      # Juice Shop's postinstall hook does the full compile:
      # installs frontend deps, builds the Angular frontend, runs tsc
      - name: Install dependencies & compile
        run: npm install

      # ---- FIREWALL DEMO (leave commented until quarantine is ON) ----
      # Simulates a developer adding a critically-vulnerable dependency.
      # lodash@4.17.4 (2017) has known critical CVEs and is NOT in this
      # app's tree, so it won't already be in the proxy's cache. With
      # quarantine enabled on demo-npm-proxy, Firewall blocks the download
      # (npm gets a 403) and this step fails the build — Firewall in action.
      # The component then appears in IQ under Firewall > Quarantine.
      # - name: "FIREWALL DEMO: developer adds a vulnerable dependency"
      #   run: npm install lodash@4.17.4 --prefix /tmp/firewall-demo

      # ---- POST-BUILD STEP: Sonatype Lifecycle SCA policy evaluation ----
      - name: Sonatype Lifecycle evaluation
        id: evaluate
        uses: sonatype/actions/evaluate@v1
        with:
          iq-server-url: ${{ secrets.SONATYPE_LIFECYCLE_URL }}   # http://localhost:8070
          username: ${{ secrets.SONATYPE_USERNAME }}
          password: ${{ secrets.SONATYPE_PASSWORD }}
          application-id: vh          # must match the app's ID in Lifecycle
          scan-targets: package-lock.json frontend/package-lock.json
          stage: build

      - name: Lifecycle report link
        if: always()
        run: echo "Report -> ${{ steps.evaluate.outputs.report-url }}"
