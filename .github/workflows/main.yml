name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # Pull ALL npm packages through your Nexus Repository proxy
  # (applies to the nested frontend install too)
  npm_config_registry: http://localhost:8081/repository/demo-npm-proxy/
  npm_config_legacy_peer_deps: "true"
  # Repo's .npmrc sets package-lock=false; override so lockfiles are
  # generated (Sonatype will scan these in stage 2)
  npm_config_package_lock: "true"

jobs:
  build:
    runs-on: self-hosted   # your Mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dependabot mass-bumped this fork's dependencies across MAJOR versions
      # (ethers 5->6, wagmi 0.x->2.x, ngx-translate, ng-gallery, TS 7...),
      # which the Juice Shop source code was never written for. Restore the
      # known-good manifests from upstream juice-shop v20.1.1 so the app
      # compiles. (Permanent fix: commit these two files and disable
      # Dependabot on the fork.)
      - name: Restore upstream v20.1.1 dependency manifests
        run: |
          curl -fsSL -o package.json https://raw.githubusercontent.com/juice-shop/juice-shop/v20.1.1/package.json
          curl -fsSL -o frontend/package.json https://raw.githubusercontent.com/juice-shop/juice-shop/v20.1.1/frontend/package.json
          echo "Manifests restored from upstream v20.1.1"

      - name: Confirm npm is pointed at Nexus
        run: npm config get registry

      # Juice Shop's postinstall hook does the full compile:
      # installs frontend deps, builds the Angular frontend, runs tsc
      - name: Install dependencies & compile
        run: npm install

      - name: Compile result
        run: echo "Build completed OK on $(hostname)"
